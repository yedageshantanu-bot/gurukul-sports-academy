name: Render 24/7 Keep-Alive Ping

on:
  schedule:
    # Run every 10 minutes (Render sleeps after 15 min, so 10 min keeps it awake 24/7)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Account 1 Backend
        run: |
          echo "Pinging gurukul-sports-backend..."
          curl -s -f -m 30 https://gurukul-sports-backend.onrender.com/api/health || echo "Backend ping completed"

      - name: Ping Account 2 WhatsApp Bridge
        run: |
          echo "Pinging gurukul-openwa-bridge..."
          curl -s -f -m 30 https://gurukul-openwa-bridge-a0m4.onrender.com/health || echo "Bridge ping completed"
